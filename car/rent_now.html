<!DOCTYPE html>
<html>
<head>
  <title>Rent a Car</title>
  <link rel="stylesheet" href="css/rent_now.css">
</head>
<body>
  <header>
    <h1>Rent a Car</h1>
  </header>
  <main>
    <h2>Fill out the form below to rent a car</h2>
    <form action="./action/rent.php" method="POST">
      <label for="name">Your Name:</label>
      <input type="text" id="name" name="name" required>
      
      <label for="email">Your Email:</label>
      <input type="email" id="email" name="email" required>
      
      <label for="phone">Phone Number:</label>
      <input type="tel" id="phone" name="phone" required>
      
      <label for="car">Select a Car:</label>
      <select id="car" name="car" required>
        <option value="">Select a car</option>
        <option value="car1">LR Defender</option>
        <option value="car2">Toyota Fortuner</option>
        <option value="car3">Hyundai i20</option>
        
      </select>
      
      <label for="pickup">Pickup Date and Time:</label>
      <input type="datetime-local" id="pickup" name="pickup" required>
      
      <label for="return">Return Date and Time:</label>
      <input type="datetime-local" id="return" name="return" required>
      
      <button type="submit">Rent Now</button>
    </form>
  </main>
  <footer>
    <p>&copy;  Car Rental Service. All rights reserved.</p>
  </footer>
</body>
</html>
